<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
  <a class="brand" th:href="@{/dashboard}"><span class="brand-mark">F</span><span>folio<span class="brand-dot">.</span></span></a>
  <div class="nav-label">WORKSPACE</div>
  <nav class="side-nav">
    <a th:classappend="${active == 'dashboard'} ? ' active'" th:href="@{/dashboard}"><span class="nav-icon">◫</span>Overview</a>
    <a th:classappend="${active == 'transactions'} ? ' active'" th:href="@{/transactions}"><span class="nav-icon">↕</span>Transactions</a>
    <a th:classappend="${active == 'budgets'} ? ' active'" th:href="@{/budgets}"><span class="nav-icon">◷</span>Budgets</a>
    <a th:classappend="${active == 'reports'} ? ' active'" th:href="@{/reports}"><span class="nav-icon">▥</span>Reports</a>
  </nav>
  <div class="nav-label secondary-label">PREFERENCES</div>
  <nav class="side-nav">
    <a th:classappend="${active == 'profile'} ? ' active'" th:href="@{/profile}"><span class="nav-icon">○</span>Profile</a>
    <a th:classappend="${active == 'settings'} ? ' active'" th:href="@{/settings}"><span class="nav-icon">⚙</span>Settings</a>
  </nav>
  <div class="sidebar-bottom">
    <div class="help-card"><div class="help-icon">i</div><strong>Money, in focus.</strong><span>A clearer view of what matters.</span></div>
    <div class="side-user"><div class="avatar" th:text="${#strings.substring(currentUser.name, 0, 1)}">A</div><div class="side-user-info"><strong th:text="${currentUser.name}">Alex Morgan</strong><span th:text="${currentUser.email}">viewer@demo.com</span></div><form th:action="@{/logout}" method="post"><button class="logout-icon" title="Sign out" aria-label="Sign out">↗</button></form></div>
  </div>
</aside>
<div class="mobile-bar" th:fragment="mobileNav(active)">
  <a class="brand" th:href="@{/dashboard}"><span class="brand-mark">F</span><span>folio<span class="brand-dot">.</span></span></a>
  <form th:action="@{/logout}" method="post"><button class="mobile-logout">Sign out ↗</button></form>
  <nav class="mobile-nav">
    <a th:classappend="${active == 'dashboard'} ? ' active'" th:href="@{/dashboard}">Overview</a>
    <a th:classappend="${active == 'transactions'} ? ' active'" th:href="@{/transactions}">Activity</a>
    <a th:classappend="${active == 'budgets'} ? ' active'" th:href="@{/budgets}">Budgets</a>
    <a th:classappend="${active == 'reports'} ? ' active'" th:href="@{/reports}">Reports</a>
    <a th:classappend="${active == 'profile' or active == 'settings'} ? ' active'" th:href="@{/settings}">Account</a>
  </nav>
</div>
<header class="topbar" th:fragment="topbar(section)">
  <div><span class="eyebrow">PERSONAL FINANCE</span><h1 th:text="${section}">Overview</h1></div>
  <div class="topbar-right"><span class="today-chip"><span class="live-dot"></span> Your finances, in one place</span><div class="avatar top-avatar" th:text="${#strings.substring(currentUser.name, 0, 1)}">A</div></div>
</header>
<div th:fragment="alerts">
  <div class="flash success-flash" th:if="${success}" th:text="${success}"></div>
  <div class="flash error-flash" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
